name: Make Release

on:
  push:
    tags:
      - 'v*'            # Trigger on standard tags like v1.0.0
      - '!DiskShed*'    # Explicitly ignore DiskShed tags
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .

permissions:
  contents: write

defaults:
  run:
    shell: bash {0}

jobs:
  build-linux-win:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 markdown libfuse-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux
        run: |
          sudo make -C build/unix NOUNITTESTS=1 unixpackage

      - name: Build Windows
        run: |
          sudo make -C build/unix NOUNITTESTS=1 winpackage

      - name: Upload Linux/Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-win-packages
          path: |
            build/unix/toolshed-*.tgz
            build/unix/toolshed-*.zip

  build-mac-universal:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install markdown || true

      - name: Build macOS Universal (No Tests, No FUSE)
        run: |
          make -C build/unix NOUNITTESTS=1 NO_COCOFUSE=1 macpackage-universal

      - name: Upload macOS Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-package
          path: |
            build/unix/toolshed-mac-universal-*.zip

  release:
    needs: [build-linux-win, build-mac-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            doc/changelog.md
            release-artifacts/toolshed-*
