name: Make Release

on:
  push:
    tags:
      - 'v*'            # Trigger on standard tags like v1.0.0
      - '!DiskShed*'    # Explicitly ignore DiskShed tags
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

permissions:
  contents: write

defaults:
  run:
    shell: bash {0}

jobs:
  build-linux-win:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 markdown libfuse-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux
        run: |
          sudo make -C build/unix unixpackage

      - name: Build Windows
        run: |
          sudo make -C build/unix winpackage

      - name: Results
        run: |
          [ -f build/unix/toolshed-*.tgz ] && ls build/unix/toolshed-*.tgz | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; tar tzvf {}'
          [ -f build/unix/toolshed-*.zip ] && ls build/unix/toolshed-*.zip | xargs -I {} bash -c 'echo; md5sum {}; ls -al --color=auto {}; unzip -l -v {}'

      - name: Upload Linux/Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-win-packages
          path: |
            build/unix/toolshed-*.tgz
            build/unix/toolshed-*.zip

  build-mac:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install markdown || true

      - name: Build macOS (${{ matrix.arch }})
        run: |
          make -C build/unix macpackage || make -C build/unix unixpackage

      - name: Results
        run: |
          ls build/unix/toolshed-* 2>/dev/null || true

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-packages
          path: |
            build/unix/toolshed-*.tgz
            build/unix/toolshed-*.tar.gz
            build/unix/toolshed-*.zip

  release:
    needs: [build-linux-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: |
            doc/changelog.md
            release-artifacts/toolshed-*
